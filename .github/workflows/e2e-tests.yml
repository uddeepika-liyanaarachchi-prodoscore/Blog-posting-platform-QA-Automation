name: QA Selenium E2E Test Suite

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to run tests against'
        required: false
        default: 'https://uddeepika-liyanaarachchi-prodoscore.github.io/Blog-posting-platform-Front-End/app/index.html'
  repository_dispatch:
    types: [run-qa-tests]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA Automation Repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies via uv
        run: uv sync

      - name: Set up Google Chrome Stable
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run E2E Tests via run_tests.py
        env:
          BROWSER: "chrome"
          HEADLESS: "true"
          EXPLICIT_WAIT: "15"
          BASE_URL: ${{ github.event.client_payload.target_url || inputs.target_url || 'https://uddeepika-liyanaarachchi-prodoscore.github.io/Blog-posting-platform-Front-End/app/index.html' }}
        run: |
          uv run python run_tests.py

      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-qa-html-report
          path: reports/
          retention-days: 14